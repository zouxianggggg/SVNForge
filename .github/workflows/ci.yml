name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion xvfb

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run extension host tests
        run: xvfb-run -a npm test

      - name: Run SVN smoke test
        run: npm run smoke:svn

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: svnforge-vsix
          path: '*.vsix'
