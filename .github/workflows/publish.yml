name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion xvfb

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run compile
          xvfb-run -a npm test
          npm run smoke:svn

      - name: Package VSIX
        run: npm run package:vsix

      - name: Publish to Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "$(ls -1 *.vsix | head -n 1)" --no-yarn

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: svnlens-release-vsix
          path: '*.vsix'
